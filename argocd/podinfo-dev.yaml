apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-dev
  namespace: argocd                      # Applications always live in ArgoCD's namespace
spec:
  project: default
  source:                                # WHERE is the desired state?
    repoURL: https://github.com/AchourMedAmine/tp4-gitops.git
    targetRevision: main                 # which branch
    path: apps/podinfo/overlays/dev      # which folder (ArgoCD detects kustomization.yaml)
  destination:                           # WHERE should it be applied?
    server: https://kubernetes.default.svc   # = this same cluster
    namespace: podinfo-dev
  syncPolicy:
    automated:
      prune: true                        # something removed from Git → removed from cluster
      selfHeal: true                     # manual change on cluster → reverted
    syncOptions:
      - CreateNamespace=true
