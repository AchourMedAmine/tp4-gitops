apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-dev          # every resource goes into this namespace
resources:
  - ../../base                  # start from the base...
images:                         # ...override the image tag (scenarios 1, 3, 5)
  - name: ghcr.io/stefanprodan/podinfo
    newTag: "6.16.0"
replicas:                       # ...override the replica count (scenarios 1, 5)
  - name: podinfo
    count: 2
