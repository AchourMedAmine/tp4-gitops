apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo              # "apply this patch to the Deployment named podinfo"
spec:
  template:
    spec:
      containers:
        - name: podinfo      # "...to its container named podinfo"
          env:
            - name: PODINFO_UI_MESSAGE
              value: "PROD"
            - name: PODINFO_UI_COLOR
              value: "#c62828"     # red page, so you can't confuse prod with dev
          resources:
            limits:
              memory: 256Mi        # prod gets more memory headroom
