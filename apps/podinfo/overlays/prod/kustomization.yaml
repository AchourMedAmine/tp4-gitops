apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-prod
resources:
  - ../../base               # the SAME base as dev
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: "6.16.0"
replicas:
  - name: podinfo
    count: 3                 # prod gets more copies
patches:
  - path: patch-prod.yaml    # prod-specific changes
