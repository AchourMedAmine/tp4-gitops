apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  selector:
    app: podinfo           # send traffic to pods carrying this label
  ports:
    - name: http
      port: 9898
      targetPort: http     # refers to the port NAME in the Deployment
    - name: http-metrics
      port: 9797
      targetPort: http-metrics
